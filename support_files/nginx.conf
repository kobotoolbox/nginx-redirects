user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        root /var/www/html;
        index index.html;

        server_name _;

        location / {
            # This should never happen! Don't redirect permanently because we don't
            # want browsers caching whatever mistake landed us here
            rewrite_log on;
            rewrite ^ http://www.kobotoolbox.org;
        }

        location /service_health/ {
            add_header "Content-Type" "text/plain";
            return 200 "OK kobo-support-docker";
        }
    }

    server {
        listen 80;
        listen [::]:80;
        root /var/www/html;
        index index.html;

        server_name kobotoolbox.org kobotoolbox.com *.kobotoolbox.com;

        location / {
            # Redirect the "apex" domain to the www subdomain
            return 301 https://www.kobotoolbox.org$request_uri;
        }
    }

    server {
        server_name support.kobotoolbox.org;
        listen 80;
        listen [::]:80;
        root /var/www/html;
        index index.html;

        # rewrite_log on;

        # TODO: make redirections `permanent` once everything is verified to work well

        # FIXME: Check with Tino that the intent is to redirect all "collections" links
        # to the root
        rewrite ^/en/collections / redirect;

        ## The rules need to catch anything that starts with the article ID
        rewrite ^/en/articles/1336786 /record_validation.html redirect;
        rewrite ^/en/articles/1522966 /hxl.html redirect;
        rewrite ^/en/articles/1522971 /matrix_response.html redirect;
        rewrite ^/en/articles/1559346 /pulling_data_into_excelquery.html redirect;
        rewrite ^/en/articles/1562082 /project_summary.html redirect;
        rewrite ^/en/articles/1564770 /rating_ranking.html redirect;
